.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.62))}
.cover .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 22px}
.cover .kicker{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.85);color:#e05a86;font-size:12px;font-weight:700;letter-spacing:.14em;padding:5px 12px;border-radius:99px;margin-bottom:10px}
.cover h1{font-size:clamp(24px,6vw,34px);font-weight:800;line-height:1.25;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5)}
/* 说明 */
.intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:18px;box-shadow:0 8px 24px rgba(116,185,255,.10)}
.intro p{font-size:14px;color:var(--muted);margin-bottom:12px}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700}
.tag i{width:8px;height:8px;border-radius:50%;flex:none}
.tag.a{background:#fff1d6;color:#a06b12}.tag.a i{background:var(--lemon)}
.tag.b{background:#e7f1ff;color:#2d6fd0}.tag.b i{background:var(--sky)}
.tag.c{background:#ffe9f0;color:#d94f7c}.tag.c i{background:var(--coral)}
.tag.d{background:#e1faf3;color:#0f8f74}.tag.d i{background:var(--mint)}
/* 答题 */
.toolbar{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.toolbar .back{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.toolbar .back:disabled{opacity:.4;cursor:default}
.progress{flex:1}
.progress .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress .meta b{color:var(--ink)}
.trackbar{height:6px;border-radius:99px;background:rgba(116,185,255,.18);overflow:hidden}
.trackbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--coral));border-radius:99px;transition:width .35s ease}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 10px 28px rgba(116,185,255,.10)}
.qcard h2{font-size:clamp(18px,4.6vw,23px);font-weight:700;line-height:1.45;margin-bottom:18px}
.opts{display:grid;gap:10px}

a:{name:"享乐欲",sub:"即时舒服",ac:"#e8a33d",dot:"var(--lemon)",

  one:"你不需要一直赢，也不需要所有人都认可你，你本身就值得。"},
d:{name:"掌控欲",sub:"受不了失控",ac:"#0fa98c",dot:"var(--mint)",
  tagline:"你最容易栽在：希望所有人和事，都按你预想的路线发展。",
  intro:"你偏爱稳定、清晰、有预案的生活，讨厌突发意外、变数、他人不配合、计划被打乱。一旦事情脱离预判，焦虑、烦躁会立刻涌上来，你下意识想要干预、调整、扭转局面，强行拉回可控轨道。",
  adv:["靠谱细心，擅长规划、预判风险","做事有条理，很少莽撞冲动，擅长统筹安排","风险意识强，不容易踩大坑，习惯提前准备"],
  risks:["想要控制别人：希望伴侣、朋友、同事按你的想法做事，但人人有独立意志，强行干预只会引发冲突，让身边人觉得压抑","对微小失控过度焦虑：迟到、计划变动在你心里会持续不安，反复复盘、烦躁","为维持可控而拒绝新机会和不确定性，长期限制自己的可能性；失控时容易责怪外界"],
  steps:["严格区分“我可控的”和“我只能接纳的”：可控的是你的选择、行动、态度、预案；不可控的是别人的想法、决定、突发意外、他人节奏和运气","计划预留容错空间，别把时间表排得密不透风","把“必须如何”换成“最好这样，如果不行也可以”","不要试图改造别人，你可以表达想法，但不能要求对方顺从"],
  reminders:["你可以管好自己，但没办法掌控所有人和所有结果","控制欲的底层往往是恐惧，恐惧失控之后的不安","万事可控并不是安稳，能从容应对变化才是真正的底气","计划是用来参考的，不是束缚你的枷锁"],
  one:"真正的安稳，不是万事都在掌控之中，而是就算事情变了，你也扛得住。"}
};

var answers=[];
var counts=[0,0,0,0];

function show(id){["viewIntro","viewQuiz","viewResult"].forEach(function(x){document.getElementById(x).style.display=(x===id?"block":"none")});window.scrollTo(0,0);}
function showIntro(){show("viewIntro");}
function start(){answers=[];counts=[0,0,0,0];document.getElementById("goResult").style.display="none";show("viewQuiz");render();}
function render(){
  var i=answers.length;
  document.getElementById("btnBack").disabled=(i===0);
  document.getElementById("qCur").textContent=i+1;
  document.getElementById("qBar").style.width=Math.round((i+1)/45*100)+"%";
  document.getElementById("qText").textContent=QUESTIONS[i].q;
  var h="";
  QUESTIONS[i].opts.forEach(function(t,k){
    h+='<button class="opt '+SCALE[k].toLowerCase()+'" onclick="pick('+k+')"><span class="k">'+SCALE[k]+'</span><span>'+t+'</span></button>';
  });
  document.getElementById("optsBox").innerHTML=h;
  document.getElementById("goResult").style.display=(i===45?"inline-block":"none");
}
function pick(k){
  answers.push(k);counts[k]++;
  if(answers.length===45){finish();}else{render();}
}
function back(){
  if(answers.length===0)return;
  var v=answers.pop();counts[v]--;render();
}
function finish(){
  var keys=["a","b","c","d"];
  var ranked=keys.map(function(k,i){return {k:k,i:i,c:counts[i]};}).sort(function(x,y){return y.c-x.c});
  var top=ranked[0], sec=ranked[1], diff=top.c-sec.c;
  var T=D[top.k];
  var band=document.getElementById("resBand");
  band.style.borderLeftColor=T.ac;
  band.innerHTML='<div class="mylabel">你的核心欲望</div><h2 style="color:'+T.ac+'">'+T.name+' · '+T.sub+'</h2><p class="tagline">'+T.tagline+'</p>';
  var b='';
  b+=secHTML("intro","关于你",T.intro,"var(--sky)");
  b+=secHTML("adv","你的优势",T.adv,"var(--mint)");
  b+=secHTML("risk","深层坑点",T.risks,"var(--coral)");
  b+=secHTML("steps","落地调整思路",T.steps,"var(--sky)");
  b+=secHTML("rem","日常提醒清单",T.reminders,"var(--grape)");
  b+='<div class="oneline" style="background:'+T.ac+'">一句话核心提醒：'+T.one+'</div>';
  if(diff<=3){
    var S2=D[sec.k];
    b+='<div class="sec" style="border:1.5px dashed var(--coral)"><h3 style="color:var(--coral)">双欲望拉扯提醒</h3><p>第一名和第二名分数只差 '+diff+' 分，说明你可能同时被两种欲望拉扯。第二高欲望是：<b>'+S2.name+' · '+S2.sub+'</b>。</p></div>';
    b+=secHTML("adv","你的第二层优势",S2.adv,"var(--mint)");
    b+=secHTML("rem","第二层的提醒清单",S2.reminders,"var(--grape)");
  }
  document.getElementById("resBody").innerHTML=b;
  show("viewResult");
}
function secHTML(kind,title,items,dot){
  var isList=(kind==="adv"||kind==="risk"||kind==="rem"||kind==="steps");
  var inner;
  if(isList){
    var lis="";
    items.forEach(function(x){lis+='<li style="--dot:'+dot+'">'+x+'</li>';});
    inner='<ul class="plain">'+lis+'</ul>';
  }else{
    inner='<p>'+items+'</p>';
  }
  return '<div class="sec"><h3 style="color:'+dot+'">'+title+'</h3>'+inner+'</div>';
}

showIntro();
</script>
